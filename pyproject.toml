[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-multifidelity-graph-query"
version = "0.6.0"
description = "Learning and research scaffold for adaptive graph query fidelity"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
neo4j = ["neo4j>=5.26,<7"]
experiments = ["numpy>=1.24", "matplotlib>=3.7", "tzdata>=2024.1", "psutil>=5.9,<8"]

[project.scripts]
graph-mf = "graph_mf.__main__:main"

[tool.setuptools.package-data]
graph_mf = ["data/*.json", "cypher/*.cypher"]

[tool.setuptools.packages.find]
include = ["graph_mf*"]
