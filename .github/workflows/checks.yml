name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[experiments]" -r v0.1/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m graph_mf --backend memory smoke
      - run: python scripts/benchmark_budget_search.py --backend memory --nodes 200 --runs 2 --budget 8 --output results/local/ci-budget-search
      - run: python scripts/benchmark_sample_correction.py --backend memory --nodes 200 --runs 2 --output results/local/ci-correction
      - run: python -m graph_mf --backend memory benchmark --nodes 200 --repeats 2 --warmups 1 --output results/local/ci-smoke
      - run: python -m graph_mf --backend memory reuse-benchmark --nodes 200 --epochs 2 --requests 3 --warmups 1 --output results/local/ci-reuse-smoke
      - run: python -m graph_mf optimize --runs 2 --generations 3 --output results/local/ci-optimization
      - run: python -m graph_mf --backend memory adaptive-benchmark --nodes 200 --epochs 2 --timing-epochs 2 --repeats-per-tier 3 --output results/local/ci-adaptive
      - run: python -m graph_mf --backend memory deep-benchmark --sizes 200 --epochs 2 --timing-epochs 2 --output results/local/ci-deep
      - run: python -m graph_mf --backend memory cost-benchmark --epochs 2 --horizons 15 30 --output results/local/ci-cost
      - run: python -m graph_mf --backend memory audit-benchmark --epochs 2 --requests 40 --output results/local/ci-audit
      - run: python -m graph_mf --backend memory audit-benchmark --epochs 2 --requests 40 --recovery-strategy timing_only --output results/local/ci-targeted-audit
      - run: python -m graph_mf energy-probe --output results/local/ci-energy-probe.json
      - run: python -m graph_mf --backend memory energy-benchmark --epochs 2 --requests 5 --output results/local/ci-energy
      - run: python scripts/download_snb_micro.py --output results/local/ci-snb-input
      - run: python -m graph_mf --backend memory snb-benchmark --dataset-path results/local/ci-snb-input --epochs 2 --roots 8 --output results/local/ci-snb
