name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r v0.1/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m graph_mf --backend memory smoke
